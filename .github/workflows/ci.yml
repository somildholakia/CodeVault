name: CodeVault CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build and validate frontend
        run: npm run build
      - name: Validate backend JavaScript syntax
        run: npm run lint --workspace=server
      - name: Test Git engine
        run: npm test
      - name: Test product website
        run: node --test website/test/site.test.js
