services:
  - type: web
    name: codevault-api
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: REPO_STORAGE_PATH
        value: /var/data/codevault/repos
      - key: REPO_STORAGE_DURABLE
        value: "false"
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        value: https://codevault-somildholakias-projects.vercel.app
